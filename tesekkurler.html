*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--stone);line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
img{max-width:100%;display:block}a{text-decoration:none;color:inherit}
.wrap{width:min(1080px,90%);margin-inline:auto}
h1,h2{font-family:'Archivo',sans-serif;letter-spacing:-.02em;line-height:1.15}
header.nav{background:var(--ink);border-bottom:1px solid rgba(255,255,255,.08)}
header.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:76px}
.logo img{height:42px;width:auto}
header.nav a.geri{color:#dcd8d2;font-family:'Archivo';font-size:.82rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}

main{flex:1;display:grid;place-items:center;text-align:center;padding:90px 0}
main .kod{font-family:'Archivo';font-size:clamp(3.4rem,10vw,6rem);font-weight:700;color:var(--arc);line-height:1}

main p{color:var(--muted);font-weight:300;max-width:56ch;margin:0 auto 30px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;font-family:'Archivo';font-weight:600;font-size:.85rem;border-radius:2px;transition:.3s;border:1px solid var(--ink)}
.btn-s{background:var(--ink);color:#fff}.btn-s:hover{background:var(--ink-2)}
.btn-o{color:var(--ink)}.btn-o:hover{background:var(--ink);color:#fff}
footer{background:var(--ink-2);color:#9ba2a9;padding:34px 0;font-weight:300;font-size:.84rem;text-align:center}

<!-- ===== ÖLÇÜM: dönüşüm olayları ===== -->
<script>
/* ===== DÖNÜŞÜM OLAYLARI =====
   Her olay dataLayer'a gönderilir; GTM'de tetikleyici olarak kullanılır.
   GA4 + Google Ads + Meta Pixel aynı olayı dinler. */
(function(){
  var dl = function(ad, ek){
    window.dataLayer = window.dataLayer || [];
    var o = {event: ad, sayfa: location.pathname};
    if (ek) for (var k in ek) o[k] = ek[k];
    window.dataLayer.push(o);
  };

  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (!a) return;
    var h = a.getAttribute('href') || '';

    if (h.indexOf('tel:') === 0)
      dl('telefon_tiklama', {numara: h.replace('tel:','')});

    else if (h.indexOf('wa.me') > -1 || h.indexOf('whatsapp') > -1)
      dl('whatsapp_tiklama', {konum: a.closest('.mobcta') ? 'mobil_alt_cta' : 'sayfa_ici'});

    else if (h.indexOf('mailto:') === 0)
      dl('eposta_tiklama');

    else if (h.indexOf('oderenerji.com') > -1)
      dl('magaza_yonlendirme');

    else if (a.classList.contains('go') || a.classList.contains('btn-solid'))
      dl('teklif_cta_tiklama', {metin: (a.innerText||'').trim().slice(0,40)});
  }, true);

  /* form gönderimi — asıl dönüşüm */
  var f = document.querySelector('form.form');
  if (f) f.addEventListener('submit', function(){
    var k = f.querySelector('[name=konu]');
    dl('teklif_formu_gonderildi', {konu: k ? k.value : '-'});
  });

  /* okuma derinliği — içeriğin ilgi çekip çekmediğini ölçer */
  var esikler = [25,50,75,100], gecilen = {};
  window.addEventListener('scroll', function(){
    var y = (window.scrollY + window.innerHeight) / document.body.scrollHeight * 100;
    esikler.forEach(function(t){
      if (y >= t && !gecilen[t]) { gecilen[t] = 1; dl('okuma_derinligi', {yuzde: t}); }
    });
  }, {passive:true});

  /* SSS açılması — hangi soru merak ediliyor */
  document.querySelectorAll('.fq > button').forEach(function(b){
    b.addEventListener('click', function(){
      dl('sss_acildi', {soru: (b.innerText||'').trim().slice(0,60)});
    });
  });
})();
</script>
