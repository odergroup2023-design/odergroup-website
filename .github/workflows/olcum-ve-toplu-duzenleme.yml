# Gunluk otomasyon — olcum, guvenli duzeltme, yayin, dogrulama, durum kaydi
#
# Tasarim ilkesi: "dar sinif" bir inceleyiciyle degil, BETIKLERIN KENDISIYLE
# sinirlanir. tools/ altindaki betikler yalnizca asagidaki donusumleri
# yapabilir; baska bir sey uretemezler. Bu yuzden ciktilari dogrudan main e
# birlesebilir:
#   - gorsel boyutu / webp, width-height oznitelikleri, loading, decoding
#   - kritik olmayan betiklerin defer edilmesi, font-display
#   - punycode adres temizligi
#   - C2 marka satiri
#   - CTA renk standardi (D-7)
#   - sitemap lastmod
#
# Metin, iddia, fiyat, sema yapisi ve yeni sayfa ASLA bu betiklerden cikmaz.
# Onlar ayri PR olarak insan onayi bekler.
#
# Lighthouse kendi tarayicisiyla olcer: PageSpeed Insights API kotasi
# hic kullanilmaz.

name: Gunluk otomasyon

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      kuru_calisma:
        description: "true ise degisiklikler yayinlanmaz, yalnizca raporlanir"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: gunluk-otomasyon
  cancel-in-progress: false

jobs:
  otomasyon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Lighthouse kur
        run: npm install -g lighthouse

      - name: 1 — Olcum (oncesi)
        run: |
          mkdir -p rapor
          for s in index kurumsal cati-ges teknik-hizmetler-tesis-yonetimi magaza-showroom; do
            lighthouse "https://www.odergroup.com.tr/$s.html" \
              --quiet --chrome-flags="--headless --no-sandbox" \
              --form-factor=mobile --only-categories=performance \
              --output=json --output-path="rapor/$s.json" || true
          done

      - name: 2 — Guvenli duzeltmeler
        run: |
          python3 tools/toplu_duzenleme.py | tee -a $GITHUB_STEP_SUMMARY
          python3 tools/lcp_duzeltme.py   | tee -a $GITHUB_STEP_SUMMARY

      - name: 3 — Durum kaydini olcumden uret
        run: python3 tools/durum_yaz.py | tee -a $GITHUB_STEP_SUMMARY

      - name: 4 — Yayin (dar sinif, dogrudan main)
        id: yayin
        if: inputs.kuru_calisma != true
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Degisiklik yok." >> $GITHUB_STEP_SUMMARY
            echo "yayinlandi=hayir" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "ONCEKI=$(git rev-parse HEAD)" >> $GITHUB_ENV
          git add -A
          git commit -m "Gunluk otomasyon: guvenli duzeltmeler ve durum kaydi"
          git push origin HEAD:main
          echo "yayinlandi=evet" >> $GITHUB_OUTPUT
          echo "Yayinlandi: $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY

      - name: 5 — Kuru calisma farki
        if: inputs.kuru_calisma == true
        run: |
          echo "### Kuru calisma — yayinlanmadi" >> $GITHUB_STEP_SUMMARY
          echo '```diff' >> $GITHUB_STEP_SUMMARY
          git --no-pager diff --stat >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 6 — Canli dogrulama
        id: dogrula
        if: steps.yayin.outputs.yayinlandi == 'evet'
        run: |
          echo "GitHub Pages yayini icin bekleniyor..."
          sleep 150
          HATA=0
          for s in index kurumsal cati-ges tiny-house teknik-hizmetler-tesis-yonetimi \
                   magaza-showroom fuar-standi ic-dekorasyon konut-villa kentsel-donusum \
                   tadilat-restorasyon elektrik-bakim yuksek-gerilim fabrika-otomasyonu \
                   5g-altyapi enerji-verimliligi-danismanligi \
                   vaka-istanbul-magaza-donusumu vaka-fuar-standi-kurulumu \
                   vaka-cati-ges-fizibilitesi vaka-fabrika-otomasyonu vaka-teknik-tesis-bakim; do
            U="https://www.odergroup.com.tr/$s.html"
            KOD=$(curl -s -o /tmp/s.html -w "%{http_code}" "$U?v=$RANDOM")
            BOYUT=$(wc -c < /tmp/s.html)
            if [ "$KOD" != "200" ] || [ "$BOYUT" -lt 3000 ] \
               || ! grep -q "</footer>" /tmp/s.html || ! grep -q "<h1" /tmp/s.html; then
              echo "BOZUK: $s (kod=$KOD boyut=$BOYUT)" >> $GITHUB_STEP_SUMMARY
              HATA=1
            fi
          done
          echo "hata=$HATA" >> $GITHUB_OUTPUT
          [ "$HATA" = "0" ] && echo "Canli dogrulama: 21 sayfa saglam." >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: 7 — Bozulma varsa geri al
        if: steps.dogrula.outputs.hata == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git revert --no-edit HEAD
          git push origin HEAD:main
          echo "### GERI ALINDI — canli dogrulama basarisiz" >> $GITHUB_STEP_SUMMARY

      - name: 8 — Olcum (sonrasi) ve ozet tablo
        if: always()
        run: |
          echo "## Mobil Lighthouse — $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sayfa | Puan | LCP | CLS | TBT |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          for f in rapor/*.json; do
            [ -s "$f" ] || continue
            node -e "
              const r=require(process.cwd()+'/'+process.argv[1]);
              const a=r.audits,c=r.categories.performance;
              const g=k=>a[k]&&a[k].displayValue?a[k].displayValue:'-';
              console.log('| '+process.argv[1].split('/').pop().replace('.json','')
                +' | '+Math.round((c.score||0)*100)+' | '+g('largest-contentful-paint')
                +' | '+g('cumulative-layout-shift')+' | '+g('total-blocking-time')+' |');
            " "$f" >> $GITHUB_STEP_SUMMARY || true
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Esikler: LCP <= 2,5 sn · CLS <= 0,1 · mobil puan >= 90" >> $GITHUB_STEP_SUMMARY

      - name: 8b — Lighthouse FIRSAT LISTESI (LCP nin kesin sebebi)
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Lighthouse firsatlari — hangi kaynak kac ms geciktiriyor" >> $GITHUB_STEP_SUMMARY
          for f in rapor/*.json; do
            [ -s "$f" ] || continue
            node -e "
              const r=require(process.cwd()+'/'+process.argv[1]);
              const ad=process.argv[1].split('/').pop().replace('.json','');
              const a=r.audits||{};
              const lcp=(a['largest-contentful-paint']||{}).numericValue||0;
              if(lcp<=2500) return;
              console.log('');
              console.log('### '+ad+' — LCP '+(lcp/1000).toFixed(1)+' sn');
              console.log('');
              const el=a['largest-contentful-paint-element'];
              if(el&&el.details&&el.details.items&&el.details.items[0]){
                const n=el.details.items[0].items&&el.details.items[0].items[0];
                if(n&&n.node) console.log('**LCP ogesi:** \\`'+String(n.node.snippet||n.node.selector||'-').slice(0,120)+'\\`');
                console.log('');
              }
              const ph=a['lcp-lazy-loaded'];
              const sira=['render-blocking-resources','server-response-time','uses-rel-preload',
                'uses-responsive-images','modern-image-formats','unused-javascript','unused-css-rules',
                'unminified-javascript','third-party-summary','font-display','total-byte-weight','bootup-time','mainthread-work-breakdown'];
              console.log('| Firsat | Kazanc | Not |');
              console.log('|---|---|---|');
              let n=0;
              for(const k of sira){
                const x=a[k]; if(!x) continue;
                const ms=(x.details&&x.details.overallSavingsMs)||x.numericValue||0;
                if(x.score!==null&&x.score>=0.9&&ms<100) continue;
                console.log('| '+(x.title||k)+' | '+(ms?Math.round(ms)+' ms':'-')+' | '+String(x.displayValue||'').slice(0,40)+' |');
                n++;
              }
              if(!n) console.log('| (Lighthouse belirgin firsat bulmadi) | - | - |');
              console.log('');
              const zincir=a['critical-request-chains'];
              if(zincir&&zincir.displayValue) console.log('**Kritik istek zinciri:** '+zincir.displayValue);
            " "$f" >> $GITHUB_STEP_SUMMARY || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-raporu
          path: rapor/
          retention-days: 30

      - name: 9 — Basarisizsa issue ac veya guncelle
        if: failure() || steps.dogrula.outputs.hata == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const baslik = "Gunluk otomasyon basarisiz";
            const govde = [
              "Calisma: " + context.runId,
              "Baglanti: https://github.com/" + context.repo.owner + "/" +
                context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "Ayrinti is ozetinde. Canli dogrulama basarisiz olduysa degisiklik",
              "otomatik geri alindi; site onceki saglam haline dondu."
            ].join("\n");
            const acik = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "otomasyon"
            });
            const mevcut = acik.data.find(i => i.title === baslik);
            if (mevcut) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: mevcut.number, body: govde });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: baslik, body: govde, labels: ["otomasyon"] });
            }
